{title:'Your first vowels',sub:'기본 모음 ①',tip:'Hangul letters form syllable blocks. A vowel alone uses a silent ㅇ at the start: ㅇ + ㅏ = 아. Listen, then repeat 3 times.',items:[item('ㅏ','a','a vowel','Like “a” in father. Hear it as 아.','아'),item('ㅓ','eo','eo vowel','An open “uh”-like sound. English spelling is only a guide.','어'),item('ㅗ','o','o vowel','Round your lips. Hear it as 오.','오'),item('ㅜ','u','u vowel','Like “oo” in moon.','우'),item('ㅡ','eu','eu vowel','Keep your lips unrounded; listen carefully.','으'),item('ㅣ','i','i vowel','Like “ee” in see.','이')]},
{title:'Meet the consonants',sub:'기본 자음 ①',tip:'듣기는 글자 이름을 읽습니다: ㄱ → 기역 (giyeok), ㄴ → 니은 (nieun). Listen plays the letter name. Sound guide and example audio show its use in a syllable.',items:[item('ㄱ','g / k','g/k consonant','Name: 기역. Example syllable: 가.','기역'),item('ㄴ','n','n consonant','Name: 니은. Example: 나.','니은'),item('ㄷ','d / t','d/t consonant','Name: 디귿. Example: 다.','디귿'),item('ㄹ','r / l','r/l consonant','Name: 리을. A light tap at the beginning of 라.','리을'),item('ㅁ','m','m consonant','Name: 미음. Example: 마.','미음'),item('ㅂ','b / p','b/p consonant','Name: 비읍. Example: 바.','비읍'),item('ㅅ','s','s consonant','Name: 시옷. Example: 사.','시옷'),item('ㅇ','silent / ng','silent start, ng ending','Name: 이응. Silent in 아; ng at the end of 강.','이응')]},
{title:'More consonants',sub:'기본 자음 ②',tip:'듣기는 글자 이름을 읽습니다: ㅋ → 키읔 (kieuk), ㅌ → 티읕 (tieut). Listen plays the letter name. Use example audio to hear a syllable.',items:[item('ㅈ','j','j consonant','Name: 지읒. Example: 자.','지읒'),item('ㅊ','ch','ch consonant','Name: 치읓. Example: 차.','치읓'),item('ㅋ','k','aspirated k','Name: 키읔. Example: 카.','키읔'),item('ㅌ','t','aspirated t','Name: 티읕. Example: 타.','티읕'),item('ㅍ','p','aspirated p','Name: 피읖. Example: 파.','피읖'),item('ㅎ','h','h consonant','Name: 히읗. Example: 하.','히읗')]},
{title:'Read a syllable',sub:'글자 조합',tip:'With vertical vowels, put the consonant on the left. With horizontal vowels, put it on top. Try the Build tab after this lesson.',items:[item('가','ga','ㄱ + ㅏ','Left ㄱ + right ㅏ → 가.'),item('나','na','ㄴ + ㅏ'),item('너','neo','ㄴ + ㅓ'),item('고','go','ㄱ + ㅗ','Top ㄱ + bottom ㅗ → 고.'),item('무','mu','ㅁ + ㅜ'),item('미','mi','ㅁ + ㅣ')]},
{title:'More vowel sounds',sub:'모음 ②',tip:'Add a short y sound for 야, 여, 요, 유. Many modern speakers pronounce ㅐ and ㅔ similarly.',items:[item('야','ya','ㅇ + ㅑ'),item('여','yeo','ㅇ + ㅕ'),item('요','yo','ㅇ + ㅛ'),item('유','yu','ㅇ + ㅠ'),item('애','ae','ㅇ + ㅐ'),item('에','e','ㅇ + ㅔ'),item('와','wa','ㅇ + ㅘ'),item('위','wi','ㅇ + ㅟ')]},
{title:'Final consonants',sub:'받침 첫걸음',tip:'A final consonant (batchim) sits at the bottom of a block. Keep final ㄱ, ㄷ and ㅂ short: do not add a vowel after them.',items:[item('산','san','mountain','ㅅ + ㅏ + ㄴ. Finish with n.'),item('문','mun','door','ㅁ + ㅜ + ㄴ.'),item('밤','bam','night / chestnut','ㅂ + ㅏ + ㅁ. Close your lips at the end.'),item('강','gang','river','Final ㅇ sounds like ng.'),item('밥','bap','cooked rice / meal','End with closed lips; no extra “uh”.'),item('국','guk','soup','Final ㄱ is unreleased; no extra vowel.')]},
{title:'Hello, Korean!',sub:'인사하기',tip:'These polite expressions are suitable for beginners speaking with people they do not know well. Listen to the whole phrase and repeat.',items:[item('안녕하세요','annyeonghaseyo','Hello'),item('감사합니다','gamsahamnida','Thank you','ㅂ before ㄴ is pronounced like ㅁ here.'),item('네','ne','Yes'),item('아니요','aniyo','No'),item('죄송합니다','joesonghamnida','I am sorry'),item('안녕히 계세요','annyeonghi gyeseyo','Goodbye (you are leaving)','Say this to someone who is staying.'),item('안녕히 가세요','annyeonghi gaseyo','Goodbye (they are leaving)','Say this to someone who is leaving.')]},
{title:'Introduce yourself',sub:'자기소개',tip:'Use 이에요 after a final consonant, and 예요 after a vowel. Replace the sample name with your name.',items:[item('저는 안나예요','jeoneun annayeyo','I am Anna','안나 ends in a vowel → 예요.'),item('저는 학생이에요','jeoneun haksaengieyo','I am a student','학생 ends in a consonant → 이에요.'),item('이름이 뭐예요?','ireumi mwoyeyo?','What is your name?'),item('만나서 반가워요','mannaseo bangawoyo','Nice to meet you'),item('한국어를 공부해요','hangugeoreul gongbuhaeyo','I study Korean')]},
{title:'Numbers one to ten',sub:'숫자 1–10',tip:'This is the Sino-Korean number system, used for dates and prices. Korean also has native numbers, used for counting many objects and for hours.',items:[item('일','il','1'),item('이','i','2'),item('삼','sam','3'),item('사','sa','4'),item('오','o','5'),item('육','yuk','6'),item('칠','chil','7'),item('팔','pal','8'),item('구','gu','9'),item('십','sip','10')]},
{title:'At a café',sub:'카페에서',tip:'Add 주세요 to ask politely for something. Read once, listen twice, then say it without looking.',items:[item('물 주세요','mul juseyo','Water, please'),item('커피 주세요','keopi juseyo','Coffee, please'),item('얼마예요?','eolmayeyo?','How much is it?'),item('하나 주세요','hana juseyo','One, please'),item('맛있어요','masisseoyo','It is delicious','맛있어요 is commonly pronounced 마시써요.') ]},
{title:'Getting around',sub:'생활 표현',tip:'Practice a short exchange: ask where the restroom is, then thank the person.',items:[item('화장실이 어디예요?','hwajangsiri eodiyeyo?','Where is the restroom?'),item('여기요','yeogiyo','Here / Excuse me (calling attention)'),item('도와주세요','dowajuseyo','Please help me'),item('천천히 말해 주세요','cheoncheonhi malhae juseyo','Please speak slowly'),item('다시 말해 주세요','dasi malhae juseyo','Please say it again')]},
{title:'Your first conversation',sub:'첫 대화 완성',tip:'Imagine meeting a new classmate. Say the greeting, introduce yourself, and ask their name. This lesson reviews earlier phrases.',items:[item('안녕하세요','annyeonghaseyo','Hello'),item('저는 안나예요','jeoneun annayeyo','I am Anna'),item('이름이 뭐예요?','ireumi mwoyeyo?','What is your name?'),item('만나서 반가워요','mannaseo bangawoyo','Nice to meet you'),item('감사합니다','gamsahamnida','Thank you')]}

const splitJamo={'ㄲ':'ㄱㄱ','ㄸ':'ㄷㄷ','ㅃ':'ㅂㅂ','ㅆ':'ㅅㅅ','ㅉ':'ㅈㅈ','ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ','ㅐ':'ㅏㅣ','ㅒ':'ㅑㅣ','ㅔ':'ㅓㅣ','ㅖ':'ㅕㅣ','ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};
function basicParts(ch){if(strokeData[ch])return[ch];if(splitJamo[ch])return Array.from(splitJamo[ch]).flatMap(basicParts);let n=ch.charCodeAt(0)-0xac00;if(n>=0&&n<11172){let parts=[initials[Math.floor(n/588)],vowels[Math.floor(n/28)%21]];if(n%28)parts.push(finals[n%28]);return parts.flatMap(basicParts)}return[]}
let strokeTimer=0,strokeToken=0,currentGuide='',guideStroke=0;
function stopStrokes(){cancelAnimationFrame(strokeTimer);strokeToken++;}
let writeChars=[],writeIndex=0,writeDone=new Set();
function initWriting(text){writeChars=Array.from(text).filter(ch=>/^[ㄱ-ㅎㅏ-ㅣ가-힣]$/.test(ch));writeIndex=0;writeDone=new Set();if(writeChars.length)selectWriting(0);}
function renderWritingNav(){
 const tabs=document.getElementById('tracechars'),bar=document.getElementById('writenav');if(!tabs||!bar)return;
 tabs.innerHTML=writeChars.map((ch,i)=>`<button class="${i===writeIndex?'primary':'ghost'}" aria-pressed="${i===writeIndex}" onclick="selectWriting(${i})">${ch}${writeDone.has(i)?' ✓':''}</button>`).join('');
 const last=writeIndex===writeChars.length-1,complete=writeDone.size===writeChars.length;
 bar.innerHTML=`<p class="center"><b>쓰는 글자: ${writeChars[writeIndex]} · ${writeIndex+1} / ${writeChars.length}</b></p><div class="row"><button class="ghost" onclick="selectWriting(writeIndex-1)" ${writeIndex===0?'disabled':''}>← 이전 글자<br>Previous</button><button class="primary" style="flex:1" onclick="finishWriting()" ${last&&complete?'disabled':''}>${last?(complete?'쓰기 완료 ✓ · Finished':'다 썼어요 · 쓰기 완료 ✓<br>Done'):`다 썼어요 → 다음 글자: ${writeChars[writeIndex+1]}<br>Done · Next character`}</button></div>${complete?'<p class="small center">모든 글자 쓰기를 마쳤어요. 아래 Next card로 학습을 이어 가세요.<br>All characters completed. Continue with Next card below.</p>':''}`;
}
function selectWriting(i){if(!Number.isInteger(i)||i<0||i>=writeChars.length)return;writeIndex=i;trace(writeChars[i]);renderWritingNav();}
function finishWriting(){if(!writeChars.length)return;writeDone.add(writeIndex);if(writeIndex<writeChars.length-1)selectWriting(writeIndex+1);else renderWritingNav();}

function trace(ch){stopStrokes();const parts=basicParts(ch);document.getElementById('traceparts').innerHTML=parts.length>1?`<p class="small">${ch} · 전체 글자를 따라 쓰세요. 획순은 아래 자음·모음 버튼을 누르세요. / Trace the whole character; tap a part for stroke directions.</p><div class="row"><button class="primary" onclick="freeTrace('${ch}')">전체 글자: ${ch}</button>${parts.map((p,i)=>`<button class="ghost" onclick="tracePart('${p}')">${i+1}. ${p}</button>`).join('')}</div>`:'';if(parts.length===1&&parts[0]===ch)tracePart(ch);else freeTrace(ch)}
function freeTrace(ch){stopStrokes();currentGuide='';document.getElementById('guide').textContent=ch;document.getElementById('strokecontrols').hidden=true;document.getElementById('strokestatus').textContent='전체 글자 따라 쓰기 / Trace the whole character. 자음·모음 버튼: 부분별 획순 / Tap a part for stroke directions.';setupCanvas()}
function tracePart(ch){stopStrokes();currentGuide=ch;guideStroke=0;document.getElementById('strokecontrols').hidden=false;renderStrokes(-1);setupCanvas()}
function renderStrokes(active,progress=1){let paths=strokeData[currentGuide];if(!paths||!document.getElementById('guide'))return;let svg='<svg viewBox="0 0 100 100" width="100%" height="100%" aria-label="Stroke order for '+currentGuide+'">';paths.forEach((pts,i)=>{let d=pts.map((p,j)=>(j?'L':'M')+p.join(' ')).join(' ');svg+=`<path d="${d}" fill="none" stroke="#dce6d9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;let on=active<0||active===i;let color=on?'#c06623':'#92a294';let start=pts[0],end=pts[pts.length-1],prev=pts[pts.length-2],angle=Math.atan2(end[1]-prev[1],end[0]-prev[0])*180/Math.PI;svg+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/><path d="M -4 -2 L 0 0 L -4 2" transform="translate(${end}) rotate(${angle})" fill="none" stroke="${color}" stroke-width="1.2"/>`;let nx=start[0]-7,ny=start[1]-6-i*0; // numbers sit just above-left of the pen start
if(i&&Math.hypot(start[0]-paths[i-1][0][0],start[1]-paths[i-1][0][1])<5){nx=start[0]+7;ny=start[1]-6}
svg+=`<circle cx="${nx}" cy="${ny}" r="3.8" fill="${color}"/><text x="${nx}" y="${ny+1.5}" font-family="sans-serif" font-size="4.5" font-weight="bold" text-anchor="middle" fill="white">${i+1}</text>`;
if(active>=0&&i<=active){svg+=`<path class="demo-stroke" d="${d}" pathLength="1" fill="none" stroke="#176c55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1" stroke-dashoffset="${i===active?1-progress:0}"/>`}
});svg+='</svg>';document.getElementById('guide').innerHTML=svg;document.getElementById('strokestatus').textContent=active<0?`${currentGuide} · ${paths.length} strokes · Start at ① and follow the arrows.`:`${currentGuide} · Stroke ${active+1} / ${paths.length} · Follow the green line.`}
function playStrokes(single=false){if(!currentGuide)return;stopStrokes();clearTrace();let token=strokeToken,paths=strokeData[currentGuide],first=single?guideStroke:0,begin=performance.now();let count=single?1:paths.length;function frame(now){if(token!==strokeToken||!document.getElementById('canvas'))return;let elapsed=now-begin,local=Math.floor(elapsed/1600),i=first+Math.min(local,count-1),p=Math.min(1,(elapsed%1600)/1100);if(local>=count){renderStrokes(i,1);guideStroke=(i+1)%paths.length;return}renderStrokes(i,p);strokeTimer=requestAnimationFrame(frame)}strokeTimer=requestAnimationFrame(frame)}
function resetGuide(){stopStrokes();guideStroke=0;clearTrace();if(currentGuide)renderStrokes(-1)}
let penMode='pen',inkHistory=[];
function choosePen(mode){penMode=mode;['pen','eraser'].forEach(m=>{let b=document.getElementById('tool-'+m);if(b){b.className=m===mode?'primary':'ghost';b.setAttribute('aria-pressed',String(m===mode))}})}
function rememberInk(){let cv=document.getElementById('canvas');inkHistory.push(cv.getContext('2d').getImageData(0,0,cv.width,cv.height));if(inkHistory.length>20)inkHistory.shift();updateUndo()}
function updateUndo(){let b=document.getElementById('undo-ink');if(b)b.disabled=!inkHistory.length}
function undoInk(){let cv=document.getElementById('canvas');if(inkHistory.length)cv.getContext('2d').putImageData(inkHistory.pop(),0,0);updateUndo()}
function setupCanvas(){const cv=document.getElementById('canvas'),box=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=box.width*d;cv.height=box.height*d;inkHistory=[];updateUndo();choosePen('pen');let ctx=cv.getContext('2d');ctx.scale(d,d);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#197059';let active=false;function point(e){let r=cv.getBoundingClientRect();return[(e.clientX-r.left)*box.width/r.width,(e.clientY-r.top)*box.height/r.height]}cv.onpointerdown=e=>{stopStrokes();if(currentGuide)renderStrokes(-1);rememberInk();active=true;cv.setPointerCapture(e.pointerId);ctx.globalCompositeOperation=penMode==='eraser'?'destination-out':'source-over';ctx.lineWidth=penMode==='eraser'?30:8;let p=point(e);ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(p[0]+.01,p[1]+.01);ctx.stroke();e.preventDefault()};cv.onpointermove=e=>{if(active){ctx.lineTo(...point(e));ctx.stroke();e.preventDefault()}};cv.onpointerup=cv.onpointercancel=()=>{active=false;ctx.globalCompositeOperation='source-over'}}
function clearTrace(){let cv=document.getElementById('canvas');rememberInk();cv.getContext('2d').clearRect(0,0,cv.width,cv.height)}
function shuffled(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function key(c){return c.ko+'|'+c.en}function allItems(){return lessons.flatMap(l=>l.items).filter((c,i,a)=>a.findIndex(v=>key(v)===key(c))===i)}
function beginQuiz(r){isReview=r;let src=r?allItems().filter(c=>state.wrong.includes(key(c))):lessons[lid].items;if(!src.length)src=allItems();quiz=shuffled(src).slice(0,r?10:6);qi=0;score=0;showQuiz()}
function quizGroup(c){if(/^[ㄱ-ㅎ]$/.test(c.ko))return 'consonant';if(/^[ㅏ-ㅣ]$/.test(c.ko))return 'vowel';if(/^\d+$/.test(c.en))return 'number';return c.ko.length<=1?'syllable':'phrase'}
function quizValue(c){return c.ko}
function showQuiz(){stopStrokes();answered=false;let c=quiz[qi],group=quizGroup(c);let other=[...new Set(allItems().filter(x=>quizGroup(x)===group).map(quizValue))].filter(v=>v!==quizValue(c));let options=shuffled([quizValue(c),...shuffled(other).slice(0,2)]);app.classList.add('quiz-mode');app.innerHTML=`<div class="row between"><button class="ghost" onclick="${isReview?'review()':'card()'}">← 돌아가기 / Back</button><span class="small">${qi+1} / ${quiz.length}</span></div><h2>듣고 같은 글자를 골라요</h2><p class="small">Listen, then choose the matching letters.<br>${group==='consonant'?'자음 이름을 들어요. 예: ㄱ → 기역, ㅌ → 티읕<br>Listen to the consonant name.':''}</p><div class="card center" style="padding:12px"><div class="symbol ${c.ko.length>3?'long':''}" style="font-size:${c.ko.length>3?'28':'56'}px" lang="ko">${c.ko}</div><button class="primary" onclick="quizAudio()">▶ 소리 듣기 / Listen</button></div><div id="choices"></div><div class="quizbar"><div id="feedback" role="status" style="min-height:0;margin:0 0 8px">소리를 듣고 보기 하나를 누르세요.<br><span class="small">Listen and tap one answer.</span></div><button id="qnext" class="primary wide" onclick="nextQuestion()" disabled>다음 문제 → / Next</button></div>`;let el=document.getElementById('choices');options.forEach(o=>{let b=document.createElement('button');b.className='choice';b.style.textAlign='center';b.style.fontSize=o.length>8?'20px':'26px';b.textContent=o;b.onclick=()=>answer(o,b);el.appendChild(b)});window.scrollTo(0,0)}
function quizAudio(){speak(quiz[qi].say)}
function answer(o,b){if(answered)return;answered=true;let c=quiz[qi],expected=quizValue(c),ok=o===expected;if(ok){score++;b.classList.add('correct');state.wrong=state.wrong.filter(k=>k!==key(c))}else{b.classList.add('wrong');if(!state.wrong.includes(key(c)))state.wrong.push(key(c))}document.querySelectorAll('.choice').forEach(e=>{if(e.textContent===expected)e.classList.add('correct');e.disabled=true});let f=document.getElementById('feedback');f.textContent=(ok?'✓ 잘했어요! / Correct! ':'정답 / Answer: ')+expected;document.getElementById('qnext').disabled=false;save()}
function nextQuestion(){if(!answered)return;if(++qi<quiz.length)showQuiz();else{app.classList.remove('quiz-mode');let passed=score>=Math.ceil(quiz.length*.8);if(!isReview&&passed){state.done[lid]=Math.max(state.done[lid]||0,score/quiz.length);save()}app.innerHTML=`<section class="hero center"><div class="eyebrow">${isReview?'REVIEW COMPLETE':passed?'LESSON COMPLETE':'KEEP PRACTICING'}</div><h1>${score} / ${quiz.length}</h1><p>${passed?'잘했어요! Well done.':'You are learning, one step at a time.'}</p><p class="small">${isReview?'Missed cards stay in your review list.':passed?'Your progress is saved.':'Get at least 80% to complete the lesson. Review the cards and try again.'}</p><button class="primary" onclick="${isReview?'review()':passed&&lid<11?`start(${lid+1})`:'start(lid)'}">${isReview?'Back to review':passed&&lid<11?'Next lesson →':'Practice again'}</button> <button class="ghost" onclick="home()">Home</button></section>`;window.scrollTo(0,0)}}
function review(){nav('review');app.innerHTML=`<div class="eyebrow">MAKE IT STICK</div><h1>A little review.<br>A big difference.</h1><div class="grid"><div class="card"><div class="stat">${Object.keys(state.done).length}</div><span class="small">Lessons completed</span></div><div class="card"><div class="stat">${state.wrong.length}</div><span class="small">Cards to practice</span></div></div><div class="card"><h2>${state.wrong.length?'Practice your missed cards':'Ready for a mixed quiz?'}</h2><p>Recall the meaning, listen, and say each answer aloud.</p><button class="primary wide" onclick="beginQuiz(true)">Start review →</button></div><h2>Your study routine</h2><p>① Listen twice.<br>② Repeat three times.<br>③ Write it once.<br>④ Try the quiz without hints.</p><p class="small">Your lesson progress and review list are stored only on this device.</p>`}
const initials=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];const vowels=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];const finals=['None','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function builder(){nav('build');app.innerHTML=`<div class="eyebrow">HANGUL LAB</div><h1>Build a syllable.</h1><p>Choose a starting consonant, a vowel, and an optional final consonant.</p><div class="card"><label>1. Consonant (초성)<br><select class="wide" id="initial" onchange="combine()">${initials.map((x,i)=>`<option value="${i}">${x}${letterInfo[x]?' · '+letterInfo[x].name+' ('+letterInfo[x].nameRom+')':vowelInfo[x]?' · '+vowelInfo[x]:''}</option>`).join('')}</select></label><label>2. Vowel (중성)<br><select class="wide" id="vowel" onchange="combine()">${vowels.map((x,i)=>`<option value="${i}">${x}${letterInfo[x]?' · '+letterInfo[x].name+' ('+letterInfo[x].nameRom+')':vowelInfo[x]?' · '+vowelInfo[x]:''}</option>`).join('')}</select></label><label>3. Final consonant (받침)<br><select class="wide" id="final" onchange="combine()">${finals.map((x,i)=>`<option value="${i}">${x}${letterInfo[x]?' · '+letterInfo[x].name+' ('+letterInfo[x].nameRom+')':vowelInfo[x]?' · '+vowelInfo[x]:''}</option>`).join('')}</select></label><div class="bigresult" id="combined" lang="ko"></div><div class="center"><button class="primary" onclick="speak(document.getElementById('combined').textContent)">▶ Listen to syllable</button></div></div><div class="notice">Try ㄱ + ㅏ = 가, then add ㅇ to make 강 (river). A possible syllable is not always a word. Final consonant sounds can change in connected speech.</div>`;combine()}
function combine(){document.getElementById('combined').textContent=String.fromCharCode(0xAC00+(Number(document.getElementById('initial').value)*21+Number(document.getElementById('vowel').value))*28+Number(document.getElementById('final').value))}
function settings(){nav('settings');app.innerHTML=`<div class="eyebrow">YOUR LEARNING SPACE</div><h1>Make yourself<br>at home.</h1><div class="card"><h2>Reading support</h2><label><input type="checkbox" ${state.rom?'checked':''} onchange="state.rom=this.checked;save()"> Show romanization on learning cards</label><p class="small">로마자는 영어 번역이 아닌 읽기 보조입니다. 자음 카드에는 글자 이름의 로마자를 표시합니다. Romanization is a reading aid; consonant cards show the letter name.</p></div>${alphabetReference()}<div class="card"><h2>Korean audio</h2><p>전체 수업 음성 교체 · New Korean voice for all lessons. Normal and slow audio included.</p><button onclick="speak('안녕하세요')">▶ Test voice</button> <button class="ghost" onclick="voiceSettings()">소리 도움말 · Help</button><p class="small">수업·복습은 준비된 한국어 음성 파일을 재생합니다. 인터넷 연결이 필요하며 한국어 음성 설치는 필요 없습니다. 조합의 일부 받침 글자는 기기 음성을 사용합니다.<br>Lesson audio needs an internet connection, but no Korean voice installation. Some custom syllables use a device voice.</p></div><div class="card"><h2>About this app</h2><details><summary>음성 안내 · Audio</summary><p class="small">수업의 일반·느린 음성은 같은 한국어 합성 음성으로 제작했습니다. 느린 음성도 별도로 생성하여 재생 속도를 강제로 늘리지 않습니다. Korean lesson audio uses one voice, with separately generated normal and slow recordings.</p></details><p>Hangul Step · iPhone Web 1.1<br>${lessons.length} beginner lessons with English guidance.</p><p class="small">Internet is required. No ads, microphone access, or pronunciation scoring. Writing includes basic-letter stroke directions and part-by-part practice. Progress is local and is removed when app data is cleared or website data is removed.</p><details><summary>운영자용 한국어 안내</summary><p>영어 안내 기반 외국인 한국어 입문 앱입니다. 학습 → 듣기·따라 말하기 → 쓰기 → 퀴즈 순서로 진행합니다. 80% 이상 맞히면 단원 완료로 저장됩니다. Build는 글자 조합, Review는 오답 복습입니다.</p></details><button class="ghost" onclick="resetAsk()">Reset learning progress</button><div id="reset"></div></div>`}
function voiceSettings(){toast('기본 수업은 한국어 음성 설치 없이 재생됩니다. 인터넷·미디어 볼륨·블루투스 연결을 확인하세요. / Check connection, media volume and Bluetooth.');}
function resetAsk(){document.getElementById('reset').innerHTML='<p>Delete all saved progress on this device?</p><button onclick="state.done={};state.wrong=[];save();settings();toast(\'Progress reset.\')">Yes, reset</button> <button onclick="settings()">Cancel</button>'}document.addEventListener("visibilitychange",()=>{if(document.hidden)stopVoice();});home();
</script></body></html>
